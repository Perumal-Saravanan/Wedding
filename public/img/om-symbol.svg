<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Simplified Om (ॐ) symbol -->
  <g transform="translate(50, 50)">
    <!-- Main curve -->
    <path d="M-20 -10 Q-25 -5, -25 5 Q-25 15, -15 20 Q-5 25, 5 20 Q15 15, 15 5 Q15 -5, 10 -10" 
          stroke="#D4AF37" stroke-width="3" fill="none" stroke-linecap="round"/>
    
    <!-- Upper curve -->
    <path d="M-10 -15 Q0 -20, 10 -15" stroke="#D4AF37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Dot on top -->
    <circle cx="0" cy="-25" r="3" fill="#D4AF37"/>
    
    <!-- Semi-circle -->
    <path d="M-15 -8 Q0 -3, 15 -8" stroke="#D4AF37" stroke-width="2" fill="none"/>
    
    <!-- Bottom curve -->
    <path d="M-8 10 Q-5 18, 0 20 Q5 18, 8 10" stroke="#D4AF37" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Right curve -->
    <path d="M18 5 Q25 8, 28 15" stroke="#D4AF37" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
