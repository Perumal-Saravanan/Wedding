<svg width="150" height="150" viewBox="0 0 150 150" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Corner flourish design -->
  <path d="M10 10 Q10 40, 30 50 Q40 55, 50 50 Q60 45, 60 35" stroke="#D4AF37" stroke-width="2" fill="none"/>
  <path d="M10 10 Q40 10, 50 30 Q55 40, 50 50 Q45 60, 35 60" stroke="#D4AF37" stroke-width="2" fill="none"/>
  
  <!-- Decorative curves -->
  <path d="M15 15 Q15 35, 28 42" stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.6"/>
  <path d="M15 15 Q35 15, 42 28" stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.6"/>
  
  <!-- Small leaves -->
  <ellipse cx="35" cy="45" rx="3" ry="6" fill="#D4AF37" opacity="0.5" transform="rotate(-45 35 45)"/>
  <ellipse cx="45" cy="35" rx="3" ry="6" fill="#D4AF37" opacity="0.5" transform="rotate(45 45 35)"/>
  
  <!-- Dots -->
  <circle cx="60" cy="35" r="2" fill="#D4AF37"/>
  <circle cx="35" cy="60" r="2" fill="#D4AF37"/>
  <circle cx="50" cy="50" r="1.5" fill="#D4AF37" opacity="0.7"/>
  
  <!-- Extended lines -->
  <line x1="65" y1="30" x2="90" y2="25" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>
  <line x1="30" y1="65" x2="25" y2="90" stroke="#D4AF37" stroke-width="0.8" opacity="0.4"/>
</svg>
