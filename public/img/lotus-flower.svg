<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Lotus flower - traditional Indian wedding symbol -->
  
  <!-- Outer petals -->
  <g opacity="0.6">
    <ellipse cx="60" cy="40" rx="8" ry="25" fill="#D4AF37" transform="rotate(0 60 60)"/>
    <ellipse cx="60" cy="40" rx="8" ry="25" fill="#D4AF37" transform="rotate(45 60 60)"/>
    <ellipse cx="60" cy="40" rx="8" ry="25" fill="#D4AF37" transform="rotate(90 60 60)"/>
    <ellipse cx="60" cy="40" rx="8" ry="25" fill="#D4AF37" transform="rotate(135 60 60)"/>
    <ellipse cx="60" cy="40" rx="8" ry="25" fill="#D4AF37" transform="rotate(180 60 60)"/>
    <ellipse cx="60" cy="40" rx="8" ry="25" fill="#D4AF37" transform="rotate(225 60 60)"/>
    <ellipse cx="60" cy="40" rx="8" ry="25" fill="#D4AF37" transform="rotate(270 60 60)"/>
    <ellipse cx="60" cy="40" rx="8" ry="25" fill="#D4AF37" transform="rotate(315 60 60)"/>
  </g>
  
  <!-- Middle petals -->
  <g opacity="0.8">
    <ellipse cx="60" cy="45" rx="6" ry="18" fill="#D4AF37" transform="rotate(22.5 60 60)"/>
    <ellipse cx="60" cy="45" rx="6" ry="18" fill="#D4AF37" transform="rotate(67.5 60 60)"/>
    <ellipse cx="60" cy="45" rx="6" ry="18" fill="#D4AF37" transform="rotate(112.5 60 60)"/>
    <ellipse cx="60" cy="45" rx="6" ry="18" fill="#D4AF37" transform="rotate(157.5 60 60)"/>
    <ellipse cx="60" cy="45" rx="6" ry="18" fill="#D4AF37" transform="rotate(202.5 60 60)"/>
    <ellipse cx="60" cy="45" rx="6" ry="18" fill="#D4AF37" transform="rotate(247.5 60 60)"/>
    <ellipse cx="60" cy="45" rx="6" ry="18" fill="#D4AF37" transform="rotate(292.5 60 60)"/>
    <ellipse cx="60" cy="45" rx="6" ry="18" fill="#D4AF37" transform="rotate(337.5 60 60)"/>
  </g>
  
  <!-- Center -->
  <circle cx="60" cy="60" r="12" fill="#D4AF37"/>
  <circle cx="60" cy="60" r="8" fill="#FFD700" opacity="0.6"/>
  <circle cx="60" cy="60" r="4" fill="#D4AF37"/>
  
  <!-- Center dots -->
  <circle cx="60" cy="54" r="1" fill="#800020" opacity="0.8"/>
  <circle cx="56" cy="58" r="1" fill="#800020" opacity="0.8"/>
  <circle cx="64" cy="58" r="1" fill="#800020" opacity="0.8"/>
  <circle cx="60" cy="62" r="1" fill="#800020" opacity="0.8"/>
</svg>
