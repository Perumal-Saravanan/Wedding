<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Traditional rangoli geometric pattern -->
  
  <!-- Outer square -->
  <rect x="20" y="20" width="160" height="160" stroke="#D4AF37" stroke-width="1" fill="none" opacity="0.3" transform="rotate(45 100 100)"/>
  
  <!-- Inner squares -->
  <rect x="40" y="40" width="120" height="120" stroke="#D4AF37" stroke-width="1.5" fill="none" opacity="0.5" transform="rotate(45 100 100)"/>
  <rect x="60" y="60" width="80" height="80" stroke="#D4AF37" stroke-width="2" fill="none" transform="rotate(45 100 100)"/>
  
  <!-- Center diamond -->
  <rect x="80" y="80" width="40" height="40" fill="#D4AF37" opacity="0.3" transform="rotate(45 100 100)"/>
  
  <!-- Diagonal lines -->
  <line x1="30" y1="30" x2="170" y2="170" stroke="#D4AF37" stroke-width="0.5" opacity="0.4"/>
  <line x1="170" y1="30" x2="30" y2="170" stroke="#D4AF37" stroke-width="0.5" opacity="0.4"/>
  <line x1="100" y1="20" x2="100" y2="180" stroke="#D4AF37" stroke-width="0.5" opacity="0.4"/>
  <line x1="20" y1="100" x2="180" y2="100" stroke="#D4AF37" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Corner dots -->
  <circle cx="100" cy="20" r="3" fill="#D4AF37"/>
  <circle cx="100" cy="180" r="3" fill="#D4AF37"/>
  <circle cx="20" cy="100" r="3" fill="#D4AF37"/>
  <circle cx="180" cy="100" r="3" fill="#D4AF37"/>
  
  <!-- Diagonal corner dots -->
  <circle cx="35" cy="35" r="2" fill="#D4AF37" opacity="0.7"/>
  <circle cx="165" cy="35" r="2" fill="#D4AF37" opacity="0.7"/>
  <circle cx="35" cy="165" r="2" fill="#D4AF37" opacity="0.7"/>
  <circle cx="165" cy="165" r="2" fill="#D4AF37" opacity="0.7"/>
  
  <!-- Center -->
  <circle cx="100" cy="100" r="8" fill="#D4AF37"/>
  <circle cx="100" cy="100" r="4" fill="#800020" opacity="0.6"/>
</svg>
