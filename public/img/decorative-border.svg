<svg width="600" height="20" viewBox="0 0 600 20" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Repeating decorative border pattern -->
  
  <!-- Pattern 1 -->
  <g transform="translate(0, 0)">
    <circle cx="10" cy="10" r="2" fill="#D4AF37"/>
    <line x1="12" y1="10" x2="28" y2="10" stroke="#D4AF37" stroke-width="1"/>
    <circle cx="30" cy="10" r="2" fill="#D4AF37"/>
  </g>
  
  <!-- Repeat pattern every 40px -->
  <use href="#pattern" x="40"/>
  <use href="#pattern" x="80"/>
  <use href="#pattern" x="120"/>
  <use href="#pattern" x="160"/>
  <use href="#pattern" x="200"/>
  <use href="#pattern" x="240"/>
  <use href="#pattern" x="280"/>
  <use href="#pattern" x="320"/>
  <use href="#pattern" x="360"/>
  <use href="#pattern" x="400"/>
  <use href="#pattern" x="440"/>
  <use href="#pattern" x="480"/>
  <use href="#pattern" x="520"/>
  <use href="#pattern" x="560"/>
  
  <!-- Define pattern -->
  <defs>
    <g id="pattern">
      <circle cx="10" cy="10" r="2" fill="#D4AF37"/>
      <line x1="12" y1="10" x2="28" y2="10" stroke="#D4AF37" stroke-width="1"/>
      <circle cx="30" cy="10" r="2" fill="#D4AF37"/>
    </g>
  </defs>
  
  <!-- Decorative flourishes every 120px -->
  <g transform="translate(60, 10)">
    <path d="M0 0 Q-3 -3, -5 0 T-10 0" stroke="#D4AF37" stroke-width="0.8" fill="none"/>
    <path d="M0 0 Q3 -3, 5 0 T10 0" stroke="#D4AF37" stroke-width="0.8" fill="none"/>
  </g>
  <use href="#flourish" x="120"/>
  <use href="#flourish" x="240"/>
  <use href="#flourish" x="360"/>
  <use href="#flourish" x="480"/>
  
  <defs>
    <g id="flourish">
      <path d="M60 10 Q57 7, 55 10 T50 10" stroke="#D4AF37" stroke-width="0.8" fill="none"/>
      <path d="M60 10 Q63 7, 65 10 T70 10" stroke="#D4AF37" stroke-width="0.8" fill="none"/>
    </g>
  </defs>
</svg>
